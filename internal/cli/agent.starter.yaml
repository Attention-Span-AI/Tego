# Generated by tego init. The P0 subset of spec/agent/v0; examples/agents/retriever.yaml is the
# annotated version. Edit freely, then `tego compile agent.yaml` prints what will be enforced.
version: 0
name: "__NAME__"
command: ["python3", "agent.py"]
models:
  - { provider: anthropic, host: api.anthropic.com, port: 443 }
fs:
  write: ["./out/", "/dev/null"]   # everything else is read-only; reads are logged. /dev/null stores
                                   # nothing, and subprocess.DEVNULL opens it for writing
net:
  allow: []                  # the model is reached through the capture forwarder, which the run admits on
                             # its own; every other destination is refused, the host's unix sockets (the
                             # D-Bus session bus, ssh-agent, docker) included. Name one socket the agent
                             # needs, e.g. "unix:/run/user/1000/ssh-agent.socket" for git over ssh. With
                             # no net: section every IP destination is allowed and the host's unix sockets
                             # are still refused (ADR 0070); host_sockets: true opens them all
exec:
  allow: ["python3"]         # binaries the agent may run. command: above is implied, and it is what
                             # `tego run agent.yaml` runs; a command given after `--` on tego run
                             # instead is granted too, for that run only (it is your choice, not the agent's)
env:
  pass: ["PATH", "HOME"]
limits:
  memory: 4GiB               # memory.max, whole-run OOM
  pids: 256                  # pids.max
  tokens: 1000000            # from captured model usage
  # cost_usd: 10             # needs a price table (the machine config's prices:); without one a run is refused
  wall: 1h
  stall_after: 10m           # ends a run that records nothing this long. Under record: full every read
                             # is a line, so reading keeps the run alive; with record: summary at tier
                             # landlock a read is not recorded and compile warns [stall-reads-unseen]
  repeats: 5                 # same tool + input this many times in a row stops the run
record: full                 # full | summary | off. Full: every read, write and connection is a line (summary
                             # keeps refusals and a digest, and lets stall_after end a reading agent)
tier: auto                   # auto | landlock | cgroup | bpflsm
capture: auto                # auto | uprobe | forwarder | off

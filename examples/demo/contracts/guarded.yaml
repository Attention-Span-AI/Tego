# The rogue stand-in agent (agents/rogue.sh) under rules the kernel enforces. Written by hand; demo.sh copies it into
# stage/project ("./" the project, "../secrets/" the planted fake secrets), naming python3 by the file it runs as.
version: 0
name: demo-guarded
command: ["sh", "rogue.sh"]
fs:
  write: ["./out/", "./src/", "/dev/null"]   # the only places the agent may write
  reads: held                                 # records the refused read in the ledger and the reason file
  deny_read: ["../secrets/"]                 # the planted fake secrets
exec:
  allow: ["sh", "cat", "curl", "rm", "wc", "sleep", "python3"]    # whoami is NOT on the list; python3 reads $TEGO_REASON
net:
  allow: ["unix:/var/run/nscd/socket"]        # only the name-lookup socket curl asks first; no host:port, so the sink is refused
env:
  pass: ["PATH", "HOME", "SECRETS", "SINK", "HOMEISH", "PROJECT", "PYTHON3"]
limits:
  pids: 64
  memory: 512MiB
  wall: 2m
record: summary
tier: landlock
capture: off

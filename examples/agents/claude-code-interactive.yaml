# SPDX-License-Identifier: Apache-2.0
#
# Claude Code, interactive (the full-screen interface), under tego, signed in with your subscription or an API key.
# claude-code.yaml is the print-mode shape (`claude -p`, forwarder capture, one task); this is the one for a person at a
# terminal. It shares its policy with examples/demo/contracts/claude-code.yaml, which the demo kit fills
# in from the same lines: TestInteractiveExamplesMatchTheDemoKit (examples/demo) fails when the two drift apart.
#
# Run it from the project (the directory Claude Code works in), with the contract kept OUTSIDE it (a contract the agent
# could rewrite is refused):
#   install -d -m 700 .claude-state .claude-state/tmp
#   tego compile ~/contracts/claude-code-interactive.yaml
#   tego run ~/contracts/claude-code-interactive.yaml
#
# XDG_RUNTIME_DIR: "%R" asks Tego for this run's private writable harness runtime. Keep the invoking
# XDG_RUNTIME_DIR short (normally /run/user/<uid>); Tego checks cc-socks/9999999.sock fits Claude's
# 103-byte budget before launch. A long project path does not affect it. The shared /tmp fallback is
# ungranted, and host runtime sockets remain refused by builtin.host_ipc. Requires an unprivileged run
# with a provisioned claude-code harness; Tego creates and removes the private directory itself.
#
# Logging in. Claude Code's own /login is not used: it needs claude.ai and the console, which net.allow leaves out, and
# it would store the login under CLAUDE_CONFIG_DIR. Your login reaches Claude Code through the environment instead,
# and nothing is stored in this file:
#   claude setup-token                      # once, OUTSIDE tego: your Pro/Max subscription as a long-lived token
#   export CLAUDE_CODE_OAUTH_TOKEN=...      # the token it printed; or export ANTHROPIC_API_KEY=... for an API key
# Both names are in env.pass, so tego hands whichever your shell has to Claude Code and to nothing else.
#
# What makes it work interactively (docs/OPERATIONS.md):
#   - capture: off, and net.allow names api.anthropic.com:443. With capture: forwarder Claude Code exits 1 on its first
#     connectivity check, which goes straight to api.anthropic.com whatever the base URL says. The bytes of the model
#     calls are therefore not recorded; the connection, every file write, program and refusal is (record: full).
#   - fs.write has /dev/tty (the full-screen interface draws there), /dev/null (the Bash tool redirects into it) and
#     the project. The existing fs.harness-state grant covers private session sockets. Ask for less if the task allows.
#   - CLAUDE_CONFIG_DIR and CLAUDE_CODE_TMPDIR keep Claude Code's state inside the project, so ~/.claude is never
#     written.
#   - exec.allow: bash and git are what its Bash tool needs; anything else it tries is refused and recorded. Add the
#     tools your task needs.
#   - stall_after, not wall: a run that does nothing tego sees for an hour is ended; typing at the terminal counts as
#     activity (the terminal's last-read time), and so does anything the agent does. A wall is a hard cap that ends a
#     working session at the minute it expires, however busy; set one only for an unattended run.
#   - No cost_usd: a cost limit needs the machine's price table (`prices:` in the machine config), and the model calls
#     counted, which this capture: off contract does not do, so the run would be refused. Use claude-code.yaml for a
#     metered run.
version: 0
name: claude-code-interactive
command: ["claude"]
record: full
capture: off
fs:
  write: ["./", "/dev/null", "/dev/tty"]
exec:
  allow: ["bash", "git"]
net:
  allow: ["unix:/var/run/nscd/socket", "tcp://api.anthropic.com:443"]
env:
  pass: ["PATH", "HOME", "LANG", "TERM", "COLORTERM", "CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY"]
  set:
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    DISABLE_AUTOUPDATER: "1"
    CLAUDE_CONFIG_DIR: ".claude-state"
    CLAUDE_CODE_TMPDIR: ".claude-state/tmp"
    TMPDIR: ".claude-state/tmp"
    XDG_RUNTIME_DIR: "%R"
limits:
  pids: 512
  memory: 4GiB
  stall_after: 1h
ask:
  timeout: 5m

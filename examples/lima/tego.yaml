# SPDX-License-Identifier: Apache-2.0
#
# Tego on macOS: a Lima VM (https://lima-vm.io) running Ubuntu 24.04 LTS, with Tego installed in it. Tego enforces
# its rules with Linux kernel features (Landlock, cgroups, eBPF) that macOS does not have, so on a Mac it runs inside
# Linux. Usage, from a Mac (Apple silicon or Intel):
#
#   brew install lima
#   limactl start --name=tego https://github.com/Attention-Span-AI/Tego/releases/latest/download/tego.yaml
#   limactl shell tego tego doctor
#
# This file is a release asset, like install.sh, and both are in the release's signed checksums file. The
# provisioning below runs the one-line Linux install inside the VM, as the VM's default user, taking install.sh from
# the latest release, so tego and tego-control land in ~/.local/bin there. Tier 1 (no root) needs Landlock and a cgroup v2 subtree delegated to the
# user; Ubuntu 24.04's kernel and systemd give both with no setup, so nothing else is installed. `limactl shell`
# logs in over SSH, which starts outside the user's cgroup: for a run, start a shell in it first
# (`systemd-run --user --scope bash`, docs/INSTALL.md "Check the machine"). Tiers 2 and 3 need root (`sudo`), and
# tier 3 also needs `bpf` in the boot LSM list (docs/TIERS.md).
#
# Not tested on a Mac: `limactl validate` passes on this file, and the install it runs is the one tested on Linux.
minimumLimaVersion: 2.0.0

# Ubuntu 24.04 LTS server cloud images. A dated image with its digest first, then the current release image, which
# Lima uses once Ubuntu removes the dated one.
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
    digest: "sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
    digest: "sha256:6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

# Enough for an agent and its tools. Change them with `limactl edit tego` while the VM is stopped.
cpus: 4
memory: "4GiB"
disk: "20GiB"

# Your Mac home is visible read-only, as in Lima's default template, and /tmp/lima is shared writable. Tego's own
# data (~/.tego) and the projects an agent works on live in the VM's home, which is not the Mac's.
mounts:
  - location: "~"
  - location: "/tmp/lima"
    writable: true

# The dashboard (`tego serve`, 127.0.0.1:8484 in the VM) answers only connections made by its own user, and Lima's
# default port forwarder connects from the VM's guest agent, which runs as root. So 8484 is not forwarded; the
# message below forwards it over SSH, whose connection inside the VM is your user's.
portForwards:
  - guestPort: 8484
    ignore: true

# No container runtime: Tego does not need one.
containerd:
  system: false
  user: false

provision:
  # Lima runs provisioning at every boot; the install runs only while there is no tego. To upgrade, run the
  # installer again in the VM.
  - mode: user
    script: |
      #!/bin/bash
      set -eu -o pipefail
      [ -x "$HOME/.local/bin/tego" ] && exit 0
      curl -fsSL https://github.com/Attention-Span-AI/Tego/releases/latest/download/install.sh | sh

probes:
  - description: "tego to be installed"
    script: |
      #!/bin/bash
      set -eu -o pipefail
      if ! timeout 300s bash -c 'until [ -x "$HOME/.local/bin/tego" ]; do sleep 3; done'; then
        echo >&2 "tego is not installed yet"
        exit 1
      fi
    hint: |
      The install did not finish. Read /var/log/cloud-init-output.log in the VM (limactl shell {{.Name}}), or run the
      installer by hand there: curl -fsSL https://github.com/Attention-Span-AI/Tego/releases/latest/download/install.sh | sh

message: |
  Tego is installed in the VM. Next:
    limactl shell {{.Name}} tego doctor     # what the VM supports
    limactl shell {{.Name}}                 # a shell in the VM; then, for runs:
      systemd-run --user --scope bash       # a shell in your user's cgroup (tier 1 needs it)
      tego test                             # watch Tego refuse four harmless actions
      tego serve                            # the dashboard; it prints a URL with a token
  To open the dashboard on the Mac, forward its port over SSH in another terminal, then open that URL:
    ssh -F {{.Dir}}/ssh.config -N -L 8484:127.0.0.1:8484 lima-{{.Name}}

      - path: ^internal/watch/procconn/[^/]+\.go$
        linters: [forbidigo]
        text: ADR 0023
      - path: ^pkg/spec/agent/[^/]+\.go$
        linters: [forbidigo]
        text: ADR 0023
      - path: ^pkg/spec/config/[^/]+\.go$
        linters: [forbidigo]
        text: ADR 0023
      # ADR 0021 (6)'s reviewed process-start sites, one exclusion per file, each for the start-site rule's message
      # alone (the file stays under every other forbidigo rule). A start needs its own here, a row in
      # internal/platform/proc/sites_test.go, which names the functions and checks this list against its own, and a
      # sentence in each saying when it runs against proc.Arm. A file whose starts are all calls of a function that
      # starts a process, such as enforce/cgroup's rings.go, has a row and no exclusion here.
      # The run's child stage: runtime.startChild starts it after Prepare and the reaper, before Arm places the
      # group's first mark.
      - path: ^internal/runtime/launch/launcher\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # The run's open deputy (ADR 0041 D2): the child stage, a process of its own that holds no mark, starts it after
      # landlock_restrict_self and before it reports on its control pipe, so before runner.arm places the first mark.
      - path: ^internal/runtime/launch/deputy\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # The run's reaper (ADR 0020 (2)): a DNS broker's run starts it before Prepare, every other run after it, and
      # both before the stage.
      - path: ^internal/runtime/reap\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # An adoption's reaper (ADR 0055): started before the agent is moved and before any Arm; an adopter
      # places no fanotify mark (a record-only table has no listener rule, a boundary needs a plane mode).
      - path: ^internal/runtime/adopt_reap\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # Doctor's plane probe and its known answers: before Prepare in a run (doctor.ForRun), where nothing is marked
      # yet, and in `tego doctor` and the probe's own children, which mark nothing ever.
      - path: ^internal/doctor/planeknown\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      - path: ^internal/doctor/planeexecpin\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      - path: ^internal/doctor/planeprobe\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # StartHelper's own start, into helpers.scope or, failing that, this cgroup: its callers choose the moment, which
      # their own exclusions name, and proc.Start refuses it with ErrArmed while this process holds marks.
      - path: ^internal/runtime/cgroup/helper\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # The helpers that start once the marks are gone: the build's linger timer and ring trimmer, which Detach and
      # Close start after the group's close (a reaper, which holds no group, starts the timer too), and a library's
      # probe removal, which `tego run` starts with uprobe.StartDetaches once its enforcement is released.
      - path: ^internal/runtime/enforce/cgroup/linger\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      - path: ^internal/runtime/capture/uprobe/shared\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # tego run's desktop notice of a held ask (ADR 0122): started during a tier-landlock run of a non-root
      # launcher only, which places no fanotify mark (only enforce/cgroup's listener arms).
      - path: ^internal/cli/asknotice\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # The MCP relay shim's start of the declared server (ADR 0126 §4): `tego mcp relay` is a process of its own
      # inside a run, which places no fanotify mark (only enforce/cgroup's listener arms).
      - path: ^internal/cli/mcp_relay\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # The dashboard's browser opener (serve --open): tego-control's own process holds no fanotify group, since
      # nothing it links calls proc.Arm.
      - path: ^internal/control/cli/open\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # The handoff's Spawn of the sealed tego-control (ADR 0100 (1b)): a shared start, refused with ErrArmed while
      # this process holds marks; neither tego-control nor the CLI verbs that will spawn it place any.
      - path: ^internal/handoff/exec\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # Maze's check of a saved contract (`tego compile --test --offline`): the maze CLI's own process holds no
      # fanotify group, since nothing it links calls proc.Arm.
      - path: ^internal/maze/cli/save\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # tego test (ADR 0074): its starts of the tego binary, in its own process, which holds no fanotify group, and the
      # hidden __check verb's start of its decoy program, in a process that links no Arm.
      - path: ^internal/selftest/driver\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      - path: ^internal/selftest/checks\.go$
        linters: [forbidigo]
        text: reviewed process-start site
      # The dashboard's forbidigo rules: tests may build expected markup (a trusted template value); the edge's socket ban holds only in the edge's packages,
      # outside their tests and the journeys.
      - path: _test\.go$
        linters: [forbidigo]
        text: no trusted template type
      - path-except: ^internal/control/(web|peerresolve|edge_sandbox)/
        linters: [forbidigo]
        text: the edge opens no socket
      - path: (^internal/control/web/e2e/|_test\.go$)
        linters: [forbidigo]
        text: the edge opens no socket
# gofmt as a formatter: golangci-lint reports a file gofmt would change as an issue, so the lint runs (CI's
# two and `make precommit`'s) catch an unformatted file as well as the fmt step.
formatters:
  enable:
    - gofmt

# SPDX-License-Identifier: Apache-2.0
# execrules-allow: an allow-list contract whose path entries with words constrain git (ADR 0048 (1)):
# the directory t/ grants every copy, and git runs only as an allow entry names it; a deny entry still
# refuses what an allow entry names, and the image floor decides before any command rule.
version: 2
name: execrules-allow
contract: |
  version: 0
  name: conformance
  command: ["{{P}}/bin/actor", "run", "{{P}}/script.json"]
  fs:
    write: ["./out/"]
  exec:
    allow: ["{{P}}/bin/actor", "{{P}}/t/", "{{P}}/t/a0/git status", "{{P}}/t/a0/git log --oneline", "{{P}}/t/a0/git push --dry-run"]
    deny: ["git push"]
  net:
    allow: []
  env:
    pass: ["PATH"]
  record: full
dirs: [out]
actors: [t/a0/git, t/a1/git, t/a2/git, t/a3/git, t/a4/git, t/a5/git, u/git]
model:
  write: [out]
  exec_allow: [bin/actor, t]
  net_declared: true
  exec_deny: [git push]
  exec_allow_commands: [git status, git log --oneline, git push --dry-run]
cells:
  - name: allow-listed-subcommand
    op: exec
    path: t/a1/git
    argv: [git, status, --short]
    want:
      all: allow
    source: ADR 0048 (1)-(3), P1 C6 (an allow entry's subcommand admits any further options)
  - name: allow-listed-with-required-option
    op: exec
    path: t/a2/git
    argv: [git, log, --oneline, -3]
    want:
      all: allow
    source: ADR 0048 (1)-(3), P1 C6 (an option word an allow entry names is required)
  - name: refuse-unlisted-subcommand
    op: exec
    path: t/a3/git
    argv: [git, diff]
    want:
      all: refused exec.args[git]
    source: ADR 0048 (1)-(3), P1 C6 (a constrained tool's unlisted invocation)
  - name: refuse-missing-required-option
    op: exec
    path: t/a4/git
    argv: [git, log]
    want:
      all: refused exec.args[git]
    source: 'ADR 0048 (1)-(3), P1 C6 (allow: git log --oneline refuses plain git log)'
  - name: deny-beats-allow
    op: exec
    path: t/a5/git
    argv: [git, push, --dry-run]
    want:
      all: refused exec.deny[git push]
    source: 'ADR 0048 (1)-(3), P1 C6 (precedence: no allow carves a hole in a deny)'
  - name: image-floor-first
    op: exec
    path: u/git
    argv: [git, push]
    want:
      all: refused unmatched
    source: 'ADR 0048 (1)-(3), P1 C6 (precedence step 1: a refused image is never asked about, so git push keeps the floor''s unmatched)'

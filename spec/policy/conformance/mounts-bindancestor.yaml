# SPDX-License-Identifier: Apache-2.0
# A detached part beneath a parent whose write grant reaches the same directory through another bind. Root tiers
# refuse startup before either mutation or read; the listener stores no alias path that a mutation could change.
# At tier landlock the run starts and the held reads decide (ADR 0069): the file read through the moved bind is the
# deny_read target's inode, so it is refused; where the supervisor's pins could not follow the exchange of two
# directories it latches held-read-identity-unknown and refuses every held read (fail closed). Measured in an Ubuntu
# 25.10 guest (kernel 6.17, 2026-11-19); the cells said allow under E32 (ii) until then.
version: 2
name: mounts-bindancestor
contract: |
  version: 0
  name: conformance
  command: ["{{P}}/bin/actor", "run", "{{P}}/script.json"]
  fs:
    write: ["./edit/"]
    deny_read: ["./secret/"]
  exec:
    allow: ["{{P}}/bin/actor"]
  net:
    allow: []
  env:
    pass: ["PATH"]
  record: full
dirs: [secret/deep, view/a/alias, view/c/alias, view/d, edit]
files:
  secret/deep/key: fixture
mounts:
  - {kind: bind, at: edit, from: view}
  - {kind: bind, at: view/a/alias, from: secret/deep}
  - {kind: bind, at: view/c/alias, from: secret/deep}
model:
  write: [edit]
  deny_read: [secret]
  exec_allow: [bin/actor]
  net_declared: true
  plane_cannot_hold: true
  listener_refuses: true
cells:
  - name: rename-parent-through-bind
    op: rename
    path: edit/a
    dest: edit/b
    want:
      all: allow fs.write[./edit/]
    no_compile: startup is decided from the mount topology, which compile --test does not make
    source: 'ADR 0011 (listener startup refusal); ADR 0025 (detached parts)'
  - name: read-after-rename-through-bind
    op: read
    path: view/b/alias/key
    canon: secret/deep/key
    # The renamed bind is still secret/deep's inode: the held-read pin of that identity refuses it by the rule.
    want:
      all: refused fs.deny_read[./secret/]
    no_compile: startup is decided from the mount topology, which compile --test does not make
    source: 'ADR 0011 (listener startup refusal); ADR 0025 (detached parts); ADR 0069 (held reads)'
  - name: exchange-parent-through-bind
    op: exchange
    path: edit/c
    dest: edit/d
    want:
      all: allow fs.write[./edit/]
    no_compile: startup is decided from the mount topology, which compile --test does not make
    source: 'ADR 0011 (listener startup refusal); ADR 0025 (detached parts)'
  - name: read-after-exchange-through-bind
    op: read
    path: view/d/alias/key
    canon: secret/deep/key
    # RENAME_EXCHANGE of two directories, one holding a bind: the pins cannot follow it and latch (ADR 0069), so the
    # supervisor refuses under held-read-identity-unknown, not under the rule; the file is the denied one either way.
    want:
      landlock: refused held-read-identity-unknown
      root: refused fs.deny_read[./secret/]
    no_compile: startup is decided from the mount topology, which compile --test does not make
    source: 'ADR 0011 (listener startup refusal); ADR 0025 (detached parts); ADR 0069 (held reads)'

# SPDX-License-Identifier: Apache-2.0
# execrules: the command-rule grid of ADR 0048's P1 (C6) under a deny-list contract (no allow key: images
# unrestricted, command rules apply, ADR 0048 (1)). At every tier the supervisor decides command rules on
# the exec's copied facts, so a match of exec.deny, of exec.ask, or a constrained tool's unlisted invocation
# is refused with EACCES before the syscall runs. Each exec runs a copy of the actor under the ruled tool's
# name, each in a directory of its own, with the cell's argv; the copy exits 0 at once. A refusal names its
# entry; an allowed exec's rule is the image floor's and is not checked here.
version: 2
name: execrules
contract: |
  version: 0
  name: conformance
  command: ["{{P}}/bin/actor", "run", "{{P}}/script.json"]
  fs:
    write: ["./out/"]
  exec:
    deny: ["git push", "rm -r"]
    ask: ["npm install"]
  net:
    allow: []
  env:
    pass: ["PATH"]
  record: full
dirs: [out/tree/sub, t/lnk]
scripts:
  t/sh1/run.sh: |
    #!{{P}}/t/sh1/rm -rf
  t/sh2/run.sh: |
    #!{{P}}/t/sh2/x -rf
actors: [t/push/git, t/push-c/git, t/dashed/git-push, t/spoof/git, t/lnk-real/git, t/status/git, t/rmfr/rm, t/rmrec/rm, t/rmf/rm, t/npm/npm, t/sh1/rm, t/sh2/rm, t/race/git, t/mc1/ls, t/mc2/ls, t/mc3/ls, t/mc4/ls, t/one/xrm]
exec_only_actors: [t/xonly/git]
links:
  t/lnk/tool: ../lnk-real/git
  t/sh2/x: rm
# Each t/mcN/ls and its hard link t/mcN/xrm are one file of two links: a multicall image, which the matcher reads for
# the applet upstream uutils would run by the name (ADR 0048 (2) 4, amended 2026-11-11). One pair per cell, since a
# cell owns its paths. t/one/xrm is a copy of one link.
hard_links:
  t/mc1/xrm: t/mc1/ls
  t/mc2/xrm: t/mc2/ls
  t/mc3/xrm: t/mc3/ls
  t/mc4/xrm: t/mc4/ls
fifos: [t/fifo/f]
model:
  write: [out]
  net_declared: true
  exec_deny: [git push, rm -r, npm install]
cells:
  - name: deny-subcommand
    op: exec
    path: t/push/git
    argv: [git, push, origin, main]
    want:
      all: refused exec.deny[git push]
    source: ADR 0048 (1)-(3), P1 C6 (a deny entry matches its subcommand)
  - name: deny-behind-global-option
    op: exec
    path: t/push-c/git
    argv: [git, -C, ., push]
    want:
      all: refused exec.deny[git push]
    source: ADR 0048 (1)-(3), P1 C6 (git's global options stand before the subcommand)
  - name: deny-dashed-name
    op: exec
    path: t/dashed/git-push
    argv: [git-push, origin]
    want:
      all: refused exec.deny[git push]
    source: ADR 0048 (1)-(3), P1 C6 (interpretation 3, a dashed <tool>-<sub> name)
  - name: deny-argv0-spoofed
    op: exec
    path: t/spoof/git
    argv: [ls, push]
    want:
      all: refused exec.deny[git push]
    source: ADR 0048 (1)-(3), P1 C6 (argv[0] can add an interpretation, never remove one)
  - name: deny-through-symlink
    op: exec
    path: t/lnk/tool
    canon: t/lnk-real/git
    argv: [tool, push]
    want:
      all: refused exec.deny[git push]
    source: ADR 0048 (1)-(3), P1 C6 (interpretation 1 by the resolved image's name)
  - name: allow-other-subcommand
    op: exec
    path: t/status/git
    argv: [git, status]
    want:
      all: allow
    source: ADR 0048 (1)-(3), P1 C6 (a deny entry constrains only what it names)
  - name: deny-option-cluster
    op: exec
    path: t/rmfr/rm
    argv: [rm, -fr, x]
    want:
      all: refused exec.deny[rm -r]
    source: ADR 0048 (1)-(3), P1 C6 (-fr is the options f and r)
  - name: deny-long-option
    op: exec
    path: t/rmrec/rm
    argv: [rm, --recursive, x]
    want:
      all: refused exec.deny[rm -r]
    source: ADR 0048 (1)-(3), P1 C6 (the row reads --recursive as -r)
  - name: allow-rm-without-r
    op: exec
    path: t/rmf/rm
    argv: [rm, -f, x]
    want:
      all: allow
    source: ADR 0048 (1)-(3), P1 C6 (an option word narrows the entry)
  - name: ask-refused
    op: exec
    path: t/npm/npm
    argv: [npm, install, left-pad]
    want:
      all: refused exec.ask[npm install]
    source: 'ADR 0048 (1)-(3), P1 C6 (5): exec.ask is refused, completion_unsupported'
  - name: shebang-ruled-interpreter
    op: exec
    path: t/sh1/run.sh
    script: '{{P}}/t/sh1/rm'
    script_arg: -rf
    argv: [t/sh1/run.sh, out/tree]
    runs: t/sh1/rm
    want:
      all: refused exec.deny[rm -r]
    source: 'ADR 0048 (1)-(3), P1 C6 (interpretation 6: the #! interpreter''s argv, (3) as amended 2026-10-06)'
  - name: shebang-symlinked-interpreter
    op: exec
    path: t/sh2/run.sh
    script: '{{P}}/t/sh2/x'
    script_arg: -rf
    argv: [t/sh2/run.sh, out/tree]
    runs: t/sh2/rm
    want:
      all: refused exec.deny[rm -r]
    source: 'ADR 0048 (1)-(3), P1 C6 (a #! stage is read by its walked image, the final review''s first finding)'
  - name: fifo-image-unreadable
    op: exec
    path: t/fifo/f
    want:
      all: {verdict: refused, rule: image-unreadable, errno: EACCES}
    source: 'ADR 0048 (1)-(3), P1 C6 (3): an image that is not a regular file is refused image-unreadable with EACCES, the kernel''s answer (that it is never opened, the final review''s second finding, is TestExecImageHeadOpensOnlyRegular''s: this cell passed before that fix too)'
    no_compile: 'compile --test reads no file''s type: the FIFO''s refusal is the supervisor''s image-unreadable and the kernel''s EACCES'
  - name: execute-only-image
    op: exec
    path: t/xonly/git
    argv: [git, push]
    want:
      all: {verdict: refused, rule: image-unreadable, errno: EACCES}
    want_where:
      - supervisor_root: true
        want:
          all: {verdict: refused, rule: 'exec.deny[git push]', errno: EACCES}
    source: 'ADR 0048 (3): a supervisor that cannot read the image (mode 0111, the agent''s own uid) refuses it image-unreadable; a root supervisor reads it and decides the command rule'
    no_compile: 'compile --test reads no file''s mode: which refusal answers is the supervisor''s uid''s'
  - name: argv-race
    op: race-argv-exec
    no_compile: 'a race: the agent rewrites its argv while the supervisor reads it'
    path: t/race/git
    argv: [git, push]
    want:
      all: {verdict: refused, errno: EACCES}
    source: 'ADR 0048 (3) and R5 (exec.rules/argv: an allow is decided on the copied argv, and a thread that changes it after the copy is the disclosed race; the closed direction holds: no copy that read the denied word is allowed)'
  - name: multicall-suffix-name
    op: exec
    path: t/mc1/xrm
    argv: [xrm, -r, out/tree]
    runs: t/mc1/rm
    want:
      all: refused exec.deny[rm -r]
    source: 'ADR 0048 (2) 4 as amended 2026-11-11: on a file of more than one link, a name ending with rm is read as rm (upstream uutils picks the longest utility name the program name ends with; runs names that applet for the invariant)'
    no_compile: 'compile --test makes no stat of a row''s file (CommandFacts), so it cannot know the image has two links; the supervisor reads st_nlink from its walk'
  - name: multicall-argv0-suffix
    op: exec
    path: t/mc2/ls
    argv: [xrm, -fr, out/tree]
    runs: t/mc2/rm
    want:
      all: refused exec.deny[rm -r]
    source: 'ADR 0048 (2) 4 as amended 2026-11-11: argv[0] names the applet on a /proc/self/fd or /dev/fd exec and on musl builds, so it is read on every exec of a multicall image'
    no_compile: 'compile --test makes no stat of a row''s file (CommandFacts), so it cannot know the image has two links; the supervisor reads st_nlink from its walk'
  - name: multicall-utils-argv1
    op: exec
    path: t/mc3/ls
    argv: [myutils, rm, -r, out/tree]
    runs: t/mc3/rm
    want:
      all: refused exec.deny[rm -r]
    source: 'ADR 0048 (2) 4 as amended 2026-11-11: a program name ending with utils or box runs the applet argv[1] names'
    no_compile: 'compile --test makes no stat of a row''s file (CommandFacts), so it cannot know the image has two links; the supervisor reads st_nlink from its walk'
  - name: multicall-applet-without-r
    op: exec
    path: t/mc4/xrm
    argv: [xrm, -f, out/x]
    runs: t/mc4/rm
    want:
      all: allow
    source: 'ADR 0048 (2) 4 as amended 2026-11-11: the applet is read under the entry''s words like any rm (an option word narrows the entry)'
    no_compile: 'compile --test makes no stat of a row''s file (CommandFacts), so it cannot know the image has two links; the supervisor reads st_nlink from its walk'
  - name: one-link-suffix-name
    op: exec
    path: t/one/xrm
    argv: [xrm, -r, out/tree]
    want:
      all: allow
    source: 'ADR 0048 (2) 4 as amended 2026-11-11: a file of one link is no multicall image, so xrm is read as xrm (a renamed copy is R2''s residual)'


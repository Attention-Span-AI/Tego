#
# tego/no-secrets, revision 1 (ADR 0068; pkg/spec/presets/README.md is the normative list).
# Promise: the agent cannot read your secret files, and your secret variables never reach it.
#
# The file half is the built-in deny_read list, on in every contract that does not switch it off (SEMANTICS §1, "no
# deny_read:"): SSH keys, cloud credentials, token stores, browser profiles and the .env scan. This preset adds no
# entry to it. The variable half is env.pass: only the names below are inherited from the shell that starts the
# run, so a token in an exported variable (GITHUB_TOKEN, AWS_SECRET_ACCESS_KEY, an API key) is absent from the
# agent's environment. A contract adds a name it needs to its own env.pass; the lists concatenate (agent-contract R5).
#
# Frozen once released: a change is a new revision (v2/no-secrets.yaml), never an edit of this file.
env:
  pass:
    - PATH
    - HOME
    - USER
    - LOGNAME
    - SHELL
    - LANG
    - LANGUAGE
    - LC_ALL
    - LC_CTYPE
    - LC_MESSAGES
    - TERM
    - COLORTERM
    - TZ
    - NO_COLOR
    - GOPATH
    - GOROOT
    - GOCACHE
    - GOMODCACHE
    - CARGO_HOME
    - RUSTUP_HOME
    - JAVA_HOME
    - NVM_DIR
    - PYENV_ROOT
    - VIRTUAL_ENV
    - CONDA_PREFIX

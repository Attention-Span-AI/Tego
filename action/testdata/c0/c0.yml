# LAB ONLY. Copy to .github/workflows/c0.yml; never run this as product CI.
name: C0 certificate mappings
on:
  push:
    branches: ['c0/**']
  workflow_dispatch:
  pull_request:
permissions: {}
jobs:
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read, actions: read, id-token: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign only the fixed C0 blob and dump its certificate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COSIGN_SHA256: ${{ vars.C0_COSIGN_SHA256_AMD64 }}
          EXPECTED_WORKFLOW: ${{ github.workflow_ref }}
          CALLER_SHA: ${{ github.workflow_sha }}
          C0_LEG: direct
        run: .github/scripts/c0-capture.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c0-${{ github.run_id }}-${{ github.run_attempt }}-direct
          path: c0-output/
          if-no-files-found: error
          retention-days: 30
  reusable:
    uses: ./.github/workflows/c0-reusable.yml
    permissions: {contents: read, actions: read, id-token: write}

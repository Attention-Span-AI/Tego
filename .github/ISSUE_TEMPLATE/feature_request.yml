# SPDX-License-Identifier: Apache-2.0
name: Feature request
description: Something Tego could do that it does not do now
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: A command, a contract field or a behaviour. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: others
    attributes:
      label: Who else needs it
      description: Other agents, setups or workflows that hit the same problem.

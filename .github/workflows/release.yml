# SPDX-License-Identifier: Apache-2.0
#
# The tag-triggered release (docs/VERSIONING.md §5, §7.2). `scripts/release.sh push vX.Y.Z` pushes the tag;
# this workflow builds from it and publishes. Tego runs as root, so what a user installs has to be provably
# what this repository built from that tag, not merely what the download server holds:
#
#   - gate refuses a tag whose name is not vX.Y.Z or vX.Y.Z-pre, or that is not annotated, not on main, or whose
#     commit has no green ci run;
#   - goreleaser builds the static binaries (.goreleaser.yaml), one SPDX SBOM per binary, and the sha256
#     checksums file, and creates the GitHub release as a draft, described by the tag's docs/CHANGELOG.md section;
#   - govulncheck scans the rebuilt (byte-identical) binaries in reproduce, a job with no write token, and a
#     reachable vulnerability stops the release there, unpublished;
#   - reproduce builds the same tag again on a fresh runner and compares with the release's checksums;
#   - container copies that reproduced pair into the two-platform GHCR image, with no signing authority;
#   - sign downloads and hashes the release assets and checks the pushed index digest; with no checkout,
#     project code, builds or build hooks, it signs the checksums and image keylessly and attests provenance;
#   - publish uploads the signature bundle, records the image digest and takes the draft public only after
#     every preceding job succeeds. A signing failure can leave an unsigned image in GHCR, but no public release.
#
# scripts/install.sh checks the signature with cosign, or the attestation with gh, when either is present.
# Attestations need the repository public or on GitHub Enterprise Cloud. No checkout keeps the token in
# .git/config (persist-credentials: false): no step here pushes, and gh and goreleaser take it from env.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Pin the binary build and signing tools. The Debian image is not claimed reproducible (VERSIONING.md §5).
  GO_VERSION: '1.27.3'
  GORELEASER_VERSION: v2.18.2
  COSIGN_VERSION: v3.1.3
  SYFT_VERSION: v1.52.0

jobs:
  gate:
    # A tag alone does not release: its name must have a release's shape, it must be annotated, its commit must
    # be on main, and the ci workflow must have passed on that very commit (docs/VERSIONING.md §7.1). The shape
    # comes first, so a name with shell syntax in it stops here, before any step passes it on. release.sh checks
    # the same before it pushes, but a tag pushed by hand skips release.sh; this job does not depend on who
    # pushed. It guards against a maintainer's mistake, not against a pusher who can edit this file in the
    # tagged commit: a tag protection ruleset on v* is what limits who may tag. vm-matrix is run by hand and
    # cannot be waited for here; whoever tags reads its result first (§7.1).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: the tag is a release's name, annotated, on main's history, and ci passed on its commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not a release tag"; exit 1; }
          kind=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)
          [ "$kind" = tag ] || { echo "::error::$TAG is not an annotated tag"; exit 1; }
          rel=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status)
          case "$rel" in
            identical | behind) : ;;
            *) echo "::error::$SHA is not on main's history ($rel)"; exit 1 ;;
          esac
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq .total_count)
          [ "$ok" -gt 0 ] || { echo "::error::ci has no successful run on $SHA"; exit 1; }

  release:
    needs: gate
    runs-on: ubuntu-24.04
    # Each job ends at its timeout rather than at GitHub's six-hour default.
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release and upload its assets (publish takes it public)
    # A value a pusher chooses (the tag name, and the checksums path, which carries it) reaches a script only
    # through env, never as ${{ }} in run: git allows ' $ ; and | in a ref name, and an expression is pasted
    # into the script as code before the shell sees it, in a job that can upload release assets.
    # The Makefile holds to the same rule, and gate has already refused any name that is not a release's.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # goreleaser reads the tag and the commit it names
          persist-credentials: false
      - name: the installers name this repository
        run: |
          scripts/check-installer-repo.sh "$GITHUB_REPOSITORY"
          INSTALLER=scripts/install-maze.sh scripts/check-installer-repo.sh "$GITHUB_REPOSITORY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # A release is built from nothing a previous run left in a shared cache.
          cache: false
      # A preset revision this tag carries is released, so it is frozen from this tag on (ADR 0068 D3,
      # docs/VERSIONING.md §5). release.sh tag runs the same check, which a tag pushed by hand skips: the release
      # stops here, before anything is built, until pkg/spec/presets' released table lists every revision.
      - name: every preset revision the tag carries is frozen
        env:
          TAG: ${{ github.ref_name }}
        run: VERSION="$TAG" make preset-freeze
      # The release's description is the tag's section of docs/CHANGELOG.md, the text release.sh tag also puts in the
      # tag's message (.goreleaser.yaml writes no changelog of its own). A tag with no section stops here. The file is
      # written outside the checkout, which goreleaser requires to be clean.
      - name: the release notes are the tag's changelog section
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/release.sh notes "$TAG" > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md" || { echo '::error::empty changelog section'; exit 1; }
      # Preserve the tagged section independently of the editable GitHub draft for publish's final comparison.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 14
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: build, and create the draft release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # changelog.disable also disables --release-notes; a green upload alone cannot prove the body survived.
      - name: verify the draft contains the changelog section
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected=$(cat "$RUNNER_TEMP/release-notes.md")
          [ -n "${expected//[[:space:]]/}" ] || { echo '::error::empty changelog section'; exit 1; }
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')
          [ "$body" = "$expected" ] || { echo '::error::draft body differs from the tagged changelog'; exit 1; }
      # The tego-control goreleaser built is the one each tego pins (ADR 0100 (1b)): the tego build's pre hook built
      # its own copy for the hash, which must be these bytes, or `tego serve` would refuse the released pair.
      - name: each tego pins the tego-control it ships with
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            scripts/check-control-pin.sh --static dist/tego_linux_"$arch"*/tego dist/tego-control_linux_"$arch"*/tego-control
          done
      - name: licensing material is present and checksummed
        run: scripts/check-licenses.sh dist
      - name: locate the checksums file
        id: sums
        shell: bash
        run: |
          set -euo pipefail
          sums=(dist/*_checksums.txt)
          [ "${#sums[@]}" -eq 1 ] && [ -f "${sums[0]}" ] || { echo "::error::expected one checksums file in dist"; exit 1; }
          echo "path=${sums[0]}" >> "$GITHUB_OUTPUT"
      # The checksums file lists maze's archives, which reproduce cannot rebuild byte for byte (`goreleaser build`
      # makes no archive, and their README and LICENSE carry the checkout's mtimes), so the four binaries that went
      # into them are handed to reproduce by their hashes. The file is written into dist/, beside the checksums
      # file, so the artifact below has one root and downloads flat (upload-artifact roots several paths at their
      # common ancestor); goreleaser has already uploaded the release assets, so it is not one of them.
      - name: record the maze binaries for reproduce
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum maze_*/maze) > dist/maze-binaries.sha256
          [ "$(wc -l < dist/maze-binaries.sha256)" -eq 4 ] || { echo "::error::expected four maze binaries in dist"; cat dist/maze-binaries.sha256; exit 1; }
      # The signer receives every checksummed asset, not executable project hooks or a checkout. Several are not in
      # dist/ under their published names: a raw binary stays in its build directory, and checksum.extra_files are
      # hashed in the checkout. The script finds each one in goreleaser's dist/artifacts.json or by those globs in
      # .goreleaser.yaml, refuses a missing, doubled or outside-the-checkout file, and checks every byte it hands over
      # against the checksums file. CI's reproducible job runs this step on a full snapshot of every pull request.
      - name: stage the release assets for signing
        shell: bash
        env:
          SUMS: ${{ steps.sums.outputs.path }}
        run: |
          set -euo pipefail
          python3 scripts/stage-release-assets.py "$SUMS" "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 14
      # Hand off the original binaries, not an independently compiled container pair. The image job verifies
      # these against the checksums again, and waits for reproduce's comparison and vulnerability scan.
      - name: stage the binaries for the image
        shell: bash
        env:
          SUMS: ${{ steps.sums.outputs.path }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/container-binaries"
          for arch in amd64 arm64; do
            mkdir -p "$dir/$arch"
            for bin in tego tego-control; do
              install -m 0755 dist/"${bin}"_linux_"${arch}"*/"${bin}" "$dir/$arch/$bin"
            done
          done
          cp "$SUMS" "$dir/"
      - name: hand the binaries to the image job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-binaries
          path: ${{ runner.temp }}/container-binaries
          if-no-files-found: error
          retention-days: 14
      # reproduce compares its rebuild with this file, not with a download from the release: the release is still
      # a draft, which a read-only token cannot see.
      - name: hand the checksums file to reproduce
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: |
            ${{ steps.sums.outputs.path }}
            dist/maze-binaries.sha256
          if-no-files-found: error
          retention-days: 14

  reproduce:
    # The tag built again, from scratch, on another runner, by the same configuration and toolchain: each
    # binary must hash to what the release checksums file says. A difference means the release cannot be
    # reproduced from its source, and the draft stays a draft: publish needs this job.
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: ${{ runner.temp }}/published
      - name: rebuild and compare with the release's checksums
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          goreleaser build --clean
          sums=("$RUNNER_TEMP"/published/*_checksums.txt)
          [ "${#sums[@]}" -eq 1 ] && [ -f "${sums[0]}" ] || { echo "::error::expected one checksums file from the release job"; exit 1; }
          version="${TAG#v}"
          status=0
          for bin in tego tego-control; do
            for arch in amd64 arm64; do
              name="${bin}_${version}_linux_${arch}"
              want=$(awk -v f="$name" '$2==f {print $1}' "${sums[0]}")
              got=$(sha256sum dist/"${bin}"_linux_"${arch}"*/"${bin}" | awk '{print $1}')
              if [ -z "$want" ] || [ "$want" != "$got" ]; then
                echo "::error::$name: released ${want:-nothing}, rebuilt $got"
                status=1
              else
                echo "$name: $got reproduced"
              fi
            done
          done
          # maze, darwin and linux: the binaries the release job archived, by the hashes it recorded.
          mazes="$RUNNER_TEMP/published/maze-binaries.sha256"
          [ -f "$mazes" ] && [ "$(wc -l < "$mazes")" -eq 4 ] || { echo "::error::expected the release job's four maze binary hashes"; exit 1; }
          (cd dist && sha256sum -c "$mazes") || { echo "::error::a maze binary was not reproduced"; status=1; }
          exit "$status"
      # govulncheck runs with a read-only token and no signing identity. These rebuilt binaries are byte-identical
      # to the released ones (the comparison fails otherwise); a vulnerable build leaves the release a draft.
      - name: govulncheck the binaries being released
        shell: bash
        run: |
          set -euo pipefail
          for bin in dist/tego_linux_*/tego dist/tego-control_linux_*/tego-control dist/maze_*/maze; do
            echo "== $bin"
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary "$bin"
          done

  container:
    needs: [release, reproduce]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image; only sign can request an OIDC token
    env:
      IMAGE: ghcr.io/attention-span-ai/tego
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-binaries
          path: ${{ runner.temp }}/container-binaries
      - name: verify the image's binaries against the release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/container-binaries"
          sums="tego_${TAG#v}_checksums.txt"
          for arch in amd64 arm64; do
            for bin in tego tego-control; do
              name="${bin}_${TAG#v}_linux_${arch}"
              want=$(awk -v f="$name" '$2==f {print $1}' "$sums")
              got=$(sha256sum "$arch/$bin" | cut -d' ' -f1)
              [ "$want" = "$got" ] || { echo "::error::$name differs from the release"; exit 1; }
              chmod 0755 "$arch/$bin" # upload-artifact does not preserve executable modes
            done
            "$GITHUB_WORKSPACE/scripts/check-control-pin.sh" --static "$arch/tego" "$arch/tego-control"
          done
      - name: image tags and OCI metadata
        id: meta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          {
            echo "version=$version"
            echo 'tags<<TAGS'
            echo "$IMAGE:$version"
            if [[ "$version" != *-* ]]; then
              echo "$IMAGE:${version%.*}"
              echo "$IMAGE:latest"
            fi
            echo TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build and push the release image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: examples/container/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: BINARY_SOURCE=verified
          build-contexts: release=${{ runner.temp }}/container-binaries
          push: true
          outputs: type=registry,oci-mediatypes=true
          tags: ${{ steps.meta.outputs.tags }}
          # The explicit, signed GitHub attestation below covers the multi-platform index digest.
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Tego runs AI agents under kernel-enforced rules
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.description=Tego runs AI agents under kernel-enforced rules
      - name: hand the pushed image digest to signing
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/image-digest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: ${{ runner.temp }}/image-digest.txt
          if-no-files-found: error
          retention-days: 14

  sign:
    # No checkout, project scripts, binary execution or build hooks in the only OIDC-authorized job.
    needs: [release, reproduce, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the image signature and registry provenance
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/attention-span-ai/tego
      SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digest
          path: ${{ runner.temp }}/image-digest
      - name: verify the signing inputs
        id: verify
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_DIGEST: ${{ needs.container.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-assets"
          sums="tego_${TAG#v}_checksums.txt"
          [ -s "$sums" ] || exit 1
          # Refuse paths and malformed hashes before reading any file named by the manifest.
          while read -r hash name || [ -n "$hash$name" ]; do
            [[ "$hash" =~ ^[0-9a-f]{64}$ && "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 1
          done < "$sums"
          sha256sum --check --strict "$sums"
          for arch in amd64 arm64; do
            for bin in tego tego-control; do
              [ "$(awk -v f="${bin}_${TAG#v}_linux_${arch}" '$2==f {n++} END {print n+0}' "$sums")" -eq 1 ] || exit 1
            done
            hash=$(sha256sum "tego-control_${TAG#v}_linux_${arch}" | cut -d' ' -f1)
            grep -aFq "$hash" "tego_${TAG#v}_linux_${arch}" # read bytes only; never execute an artifact
          done
          digest=$(cat "$RUNNER_TEMP/image-digest/image-digest.txt")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ && "$digest" = "$EXPECTED_DIGEST" ]] || exit 1
          # Fetch the actual index by digest, hash its bytes and verify its tagged-source annotations.
          token=$(curl -fsS -u "$GITHUB_ACTOR:$GH_TOKEN" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:attention-span-ai/tego:pull' | jq -er .token)
          curl -fsS -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/attention-span-ai/tego/manifests/$digest" -o "$RUNNER_TEMP/image-index.json"
          [ "sha256:$(sha256sum "$RUNNER_TEMP/image-index.json" | cut -d' ' -f1)" = "$digest" ] || exit 1
          jq -e --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --arg revision "$GITHUB_SHA" --arg version "${TAG#v}" '
            .annotations["org.opencontainers.image.source"] == $source and
            .annotations["org.opencontainers.image.revision"] == $revision and
            .annotations["org.opencontainers.image.version"] == $version and
            .annotations["org.opencontainers.image.licenses"] == "Apache-2.0" and
            ([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]
          ' "$RUNNER_TEMP/image-index.json"
          echo "sums=$RUNNER_TEMP/release-assets/$sums" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: sign the checksums file (keyless)
        env:
          SUMS: ${{ steps.verify.outputs.sums }}
        run: cosign sign-blob --yes --bundle "$SUMS.sigstore.json" "$SUMS"
      # The identity is the workflow ref, not the job name: installers continue to verify this exact SAN.
      - name: verify the signature as an installer will
        env:
          SUMS: ${{ steps.verify.outputs.sums }}
        run: >
          cosign verify-blob
          --bundle "$SUMS.sigstore.json"
          --certificate-identity "$SIGNER"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          "$SUMS"
      - name: attest build provenance for every checksummed file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.verify.outputs.sums }}
          create-storage-record: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: sign and verify the image digest (keyless)
        shell: bash
        env:
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST"
      - name: attest build provenance for the image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.verify.outputs.digest }}
          push-to-registry: true
          # Storage records require artifact-metadata: write; the signed attestation needs no such authority.
          create-storage-record: false
      - name: hand the signature bundle to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signatures
          path: ${{ runner.temp }}/release-assets/*.sigstore.json
          if-no-files-found: error
          retention-days: 14
      - name: record the signed image digest
        env:
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          # shellcheck disable=SC2016 # Markdown backticks are literal.
          printf 'Container image (linux/amd64, linux/arm64): `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  publish:
    # A registry push precedes signing, so a failed image job can leave an image in GHCR; the draft stays private.
    needs: [release, reproduce, container, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # publish the draft
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signatures
          path: ${{ runner.temp }}/release-signatures
      - name: publish the release with its image digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.sign.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::missing image digest'; exit 1; }
          bundle="$RUNNER_TEMP/release-signatures/tego_${TAG#v}_checksums.txt.sigstore.json"
          [ -s "$bundle" ] || { echo '::error::missing checksum signature'; exit 1; }
          expected_file="$RUNNER_TEMP/release-notes/release-notes.md"
          expected=$(cat "$expected_file")
          [ -n "${expected//[[:space:]]/}" ] || { echo '::error::empty changelog artifact'; exit 1; }
          notes="$RUNNER_TEMP/publish-notes.md"
          cp "$expected_file" "$notes"
          # shellcheck disable=SC2016 # Markdown backticks are literal.
          printf '\n### Container image\n\n`ghcr.io/attention-span-ai/tego@%s` (linux/amd64, linux/arm64).\n' "$DIGEST" >> "$notes"
          gh release upload "$TAG" "$bundle" --repo "$GITHUB_REPOSITORY"
          # Compare with the release job's artifact immediately before publication, not with a captured draft.
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,isDraft --jq 'if .isDraft == true then .body // "" else error("release is not a draft") end')
          [ "$body" = "$expected" ] || { echo '::error::draft body differs from the tagged changelog artifact'; exit 1; }
          edit_ok=true
          if ! gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes" --draft=false; then
            edit_ok=false
            echo '::error::publication command failed; its update may have applied remotely'
          fi
          # Read back body and state even after an edit error, then fail closed on any uncertainty.
          if ! body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,isDraft --jq 'if .isDraft == false then .body // "" else error("release is not public") end') || [ "$body" != "$(cat "$notes")" ] || [ "$edit_ok" != true ]; then
            echo '::error::publication failed or its body/state is unverified; returning the release to draft'
            if ! gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true; then
              echo '::error::could not restore draft status; inspect the release manually'
            fi
            exit 1
          fi
